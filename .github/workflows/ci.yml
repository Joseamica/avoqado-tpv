name: CI

# Verificación en cada push/PR: tests + compilación de depuración. Sin firma,
# sin release, sin un solo secreto de dinero. Existe para quitarle a la Mac del
# founder la compilación de este repo (~20 sesiones de IA compiten por RAM ahí).
#
# La firma y el APK listo para compartir viven en signed-builds.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: ${{ matrix.nombre }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 🔴 D12 (21-nov): Nexgo (N86 / AngelPay) va en su propio runner, en paralelo. Antes sólo se probaba sandbox (PAX /
    # Blumon) y una prueba roja en Nexgo vivió una semana en `main` sin que nadie la viera (nació el 13-nov en
    # `6bfa913a`, arreglada en el PR #112). En paralelo no alarga el CI; el motor propio y el APK siguen sólo en sandbox.
    strategy:
      fail-fast: false
      matrix:
        include:
          - variante: Sandbox
            nombre: Tests + compilación
          - variante: Nexgo
            nombre: Tests Nexgo (AngelPay)

    steps:
      - uses: actions/checkout@v4

      # El repo lo documenta así: la ceremonia de release usa JDK 23
      # (`.claude/plugins/.../release-production.md`, Fase 3). Se replica aquí
      # para que CI compile con el mismo toolchain que usa el founder a mano.
      # 🔴 DOS JDK a propósito. Las pruebas con Robolectric (9 clases, todas de Room y
      # del cobro remoto) NO corren en JDK 23: su instrumentación usa un ASM que no sabe
      # leer bytecode tan nuevo y revienta con `NoClassDefFoundError at Shadows.java` →
      # `IllegalArgumentException at ClassReader.java` — 61 pruebas caídas el 12-sep, con
      # el MISMO código en verde en local (que usa zulu-17, como manda el CLAUDE.md del
      # repo). El 17 se instala primero para que `JAVA_HOME` siga siendo el 23 por
      # defecto: compilar y firmar conservan el toolchain de la ceremonia de release.
      - name: JDK 17 (sólo para las pruebas con Robolectric)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      # El plugin de Firebase (com.google.gms.google-services) exige este
      # archivo para CUALQUIER variante, incluida debug — no es opcional.
      # No es un secreto de alto riesgo (las api keys de Firebase client-side
      # están hechas para ir embebidas en la app), pero está gitignored y se
      # trata igual: base64 en un secreto del repo.
      - name: Reconstruir google-services.json
        run: |
          mkdir -p app
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json
          test -s app/google-services.json || { echo "::error::google-services.json quedó vacío — revisa el secreto."; exit 1; }

      # 🔴 Repo PRIVADO: GitHub da la MITAD de recursos que a uno público — 2
      # núcleos / 8 GB, no los 4/16 que tiene avoqado-android (público, OTRA
      # máquina). Confirmado contra la doc oficial, no supuesto — un OOM real
      # en signed-builds.yml (compilando 2 release seguidos) lo destapó.
      # gradle.properties del repo pide 4g sólo para Gradle; el daemon de
      # Kotlin arranca aparte. Se acota desde GRADLE_USER_HOME (gana sobre el
      # del proyecto) para no tocar lo que usa el founder en su Mac.
      - name: Acotar memoria al tamaño del runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx3g
          org.gradle.workers.max=2
          org.gradle.daemon=false
          org.gradle.parallel=false
          EOF

      - name: SDK de Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # sandbox, NO production: es el que este repo documenta como el estándar
      # (CLAUDE.md → Commands / Pre-Commit Checklist: "testSandboxDebugUnitTest,
      # 220 tests"). Además compila contra lib_services-1.6.1.2-SANDBOX.aar; el
      # flavor production usa el .aar VIEJO (1.2.0.0-PROD), con menos superficie
      # — probarlo ahí habría dado falsos negativos en código que sí es correcto.
      # Nexgo corre el mismo src/test contra su AAR de AngelPay y `ENABLE_PAX_SDK=false` (otro carril de cobro).
      - name: Tests unitarios
        run: ./gradlew test${{ matrix.variante }}DebugUnitTest
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: Comprobar que SÍ corrieron tests
        run: |
          total=$(find app/build/test-results -name '*.xml' 2>/dev/null \
            | xargs grep -ho 'tests="[0-9]*"' 2>/dev/null \
            | tr -dc '0-9\n' | paste -sd+ - | bc)
          echo "Tests ejecutados: ${total:-0}"
          if [ "${total:-0}" -lt 1 ]; then
            echo "::error::Gradle salió en 0 pero NO corrió un solo test. Verde falso."
            exit 1
          fi

      # El motor propio de cobro (`:cobropropio`) no tiene sabores: `testSandboxDebugUnitTest` no lo corre.
      # Va aparte, con su propio guardia, para que un verde de :app no esconda que aquí no corrió nada.
      - name: Tests del motor propio
        if: matrix.variante == 'Sandbox'
        run: ./gradlew :cobropropio:testDebugUnitTest
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: Comprobar que SÍ corrieron tests del motor propio
        if: matrix.variante == 'Sandbox'
        run: |
          xml=$(find cobropropio/build/test-results -name '*.xml' 2>/dev/null)
          total=$(echo "$xml" | xargs grep -ho ' tests="[0-9]*"' 2>/dev/null | tr -dc '0-9\n' | paste -sd+ - | bc)
          saltadas=$(echo "$xml" | xargs grep -ho ' skipped="[0-9]*"' 2>/dev/null | tr -dc '0-9\n' | paste -sd+ - | bc)
          corridas=$(( ${total:-0} - ${saltadas:-0} ))
          echo "Tests del motor propio corridos: $corridas (de ${total:-0}, ${saltadas:-0} saltadas)"
          if [ "$corridas" -lt 1 ]; then
            echo "::error::El módulo cobropropio salió en 0 pero NO corrió un solo test. Verde falso."
            exit 1
          fi

      # Las pruebas regeneran el esquema de Room de la libreta: si difiere del commiteado, se cambió la tabla sin su esquema.
      - name: Esquema de Room del motor propio sin cambios
        if: matrix.variante == 'Sandbox'
        run: |
          git diff --exit-code cobropropio/schemas
          nuevos=$(git ls-files --others --exclude-standard cobropropio/schemas)
          if [ -n "$nuevos" ]; then echo "::error::Esquema de Room nuevo sin commitear: $nuevos"; exit 1; fi

      # El laboratorio del motor (`:motorlab`, sólo la PAX del laboratorio): sus pruebas y su APK de depuración, para que un
      # cambio del motor (bloque R) no lo deje roto sin que nadie lo vea. JDK 17 como el paso del motor: reusa su daemon.
      - name: Tests y APK del laboratorio del motor
        if: matrix.variante == 'Sandbox'
        run: ./gradlew :motorlab:testDebugUnitTest :motorlab:assembleDebug
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: Comprobar que SÍ corrieron tests del laboratorio
        if: matrix.variante == 'Sandbox'
        run: |
          xml=$(find motorlab/build/test-results -name '*.xml' 2>/dev/null)
          total=$(echo "$xml" | xargs grep -ho ' tests="[0-9]*"' 2>/dev/null | tr -dc '0-9\n' | paste -sd+ - | bc)
          saltadas=$(echo "$xml" | xargs grep -ho ' skipped="[0-9]*"' 2>/dev/null | tr -dc '0-9\n' | paste -sd+ - | bc)
          corridas=$(( ${total:-0} - ${saltadas:-0} ))
          echo "Tests del laboratorio corridos: $corridas (de ${total:-0}, ${saltadas:-0} saltadas)"
          if [ "$corridas" -lt 1 ]; then
            echo "::error::El módulo motorlab salió en 0 pero NO corrió un solo test. Verde falso."
            exit 1
          fi

      # sandbox: "el 90% del tiempo" según la tabla de Build Variants del propio
      # CLAUDE.md — la compilación más representativa del día a día.
      - name: Compilar (debug)
        if: matrix.variante == 'Sandbox'
        run: ./gradlew assembleSandboxDebug

      - name: Reporte de tests (sólo si algo falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-tests-${{ matrix.variante }}
          # Ola final, 6ª parte: también el módulo cobropropio (reporte HTML y los XML con el mensaje de cada falla).
          path: |
            app/build/reports/tests/
            cobropropio/build/reports/tests/
            cobropropio/build/test-results/
            motorlab/build/reports/tests/
            motorlab/build/test-results/
          retention-days: 7
