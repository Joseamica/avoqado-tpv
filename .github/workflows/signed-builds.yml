name: Signed builds (PAX + Nexgo)

# Compila y firma los dos APK release en cada push a main que toque código:
#   - production  (PAX / Blumon)   → firmado, pero AÚN necesita que Blumon lo
#     reenvíe a PAX para el re-firmado real de la terminal. "Listo para
#     compartir" aquí significa "listo para mandar a Blumon", no "instalable
#     en un PAX físico" — ese sello no lo puede dar ningún CI, es de Blumon.
#   - nexgoProd   (Nexgo / AngelPay) → firmado y YA ESTÁ. Nexgo no pasa por el
#     re-firmado de PAX (confirmado en .claude/rules/release-and-git.md): esto
#     es lo que se le entrega al equipo de AngelPay tal cual.
#
# 🔴 Esto es DISTINTO de la ceremonia /avoqado:release-production (bump +
# CHANGELOG + tag + push manual). Esta CI no toca versionCode/versionName, no
# hace commit, no hace push, no sube nada al sistema AppUpdate de Avoqado ni
# contacta a Blumon/AngelPay — sólo deja los dos APK firmados, descargables,
# uno por cada push. La ceremonia sigue siendo el camino para EL release
# oficial y versionado; esto es "el binario de hoy, ya firmado, por si hace
# falta mandarlo o probarlo en un aparato ya".
#
# 🔴 LA LLAVE DE FIRMA — lo que decía aquí antes era FALSO y costó caro.
#
# Decía que la debug.keystore es «la misma en cualquier SDK del mundo». Sólo
# son iguales el DN (CN=Android Debug, O=Android, C=US) y la contraseña
# ("android"): el PAR DE LLAVES lo genera `keytool` AL AZAR en cada corrida.
# Y Android identifica una app por el CERTIFICADO con el que está firmada, no
# por el DN — dos keystores con el mismo nombre producen certificados
# distintos, y la terminal rechaza la actualización con
# INSTALL_FAILED_UPDATE_INCOMPATIBLE.
#
# Medido el 7-sep-2026: `app-nexgo-eaf0d18-signed.apk`, publicado por esta
# misma CI, llevaba el certificado 8a4a15e0… mientras que TODO lo que se
# entrega desde la Mac —Nexgo 2.8.5/2.8.6 a AngelPay, PAX 2.8.7 a Blumon, el
# release-manifest de la 2.9.0— lleva c27a1420…, la ~/.android/debug.keystore
# del founder. O sea: los APK de esta CI servían para instalar en un aparato
# LIMPIO y NO para actualizar ninguna terminal en la calle. El fallo no se ve
# en la corrida (firma y verifica en verde), sólo al intentar la instalación.
#
# Por eso la llave ya NO se genera: se reconstruye la MISMA keystore desde el
# secreto DEBUG_KEYSTORE_BASE64 (mismo patrón que google-services.json) y la
# huella se comprueba DOS veces contra HUELLA_ESPERADA — al reconstruirla, y
# sobre cada APK ya firmado. Si no coincide, la corrida falla y no se publica
# nada.
#
# Ojo con el matiz que el comentario viejo tenía a medias: es cierto que la
# firma no protege el binario frente a PAX ni a AngelPay (ellos verifican por
# su cuenta), pero esa llave privada ES la identidad de la app en cada
# terminal instalada. Perderla o rotarla deja a la flota sin poder
# actualizarse. Cómo se sube el secreto, y qué cuidados lleva:
# .claude/rules/release-and-git.md → «La llave de firma y el CI».

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/signed-builds.yml'
  workflow_dispatch:

concurrency:
  group: signed-builds-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # sólo para crear el GitHub Release; nunca empuja un commit

env:
  # Huella SHA-256 del certificado de la ~/.android/debug.keystore del founder:
  # la ÚNICA con la que un APK puede actualizar una terminal que ya tiene
  # Avoqado instalado. Va aquí EN CLARO y no en un secreto a propósito — es una
  # llave pública (no protege nada) y su valor es justo el candado: un secreto
  # se puede cambiar en silencio para que cuadre con la keystore equivocada,
  # este número no se mueve sin que se vea en el diff.
  HUELLA_ESPERADA: 'c27a142019340122cfdbb601ee3128f3bfb057ac22ef098a37c4bbdca32e0a11'

jobs:
  compilar_y_firmar:
    name: Compilar y firmar (PAX + Nexgo)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Ver la nota de ci.yml: las pruebas con Robolectric exigen JDK 17; compilar y
      # firmar conservan el 23 de la ceremonia de release. El 17 va primero para que
      # `JAVA_HOME` por defecto siga siendo el 23.
      - name: JDK 17 (sólo para las pruebas con Robolectric)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Reconstruir google-services.json
        run: |
          mkdir -p app
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json
          test -s app/google-services.json || { echo "::error::google-services.json quedó vacío."; exit 1; }

      # 🔴 La llave NO se genera aquí (el porqué, en el encabezado): se
      # reconstruye la MISMA ~/.android/debug.keystore del founder. Va ANTES de
      # compilar a propósito — un secreto que falta, o que trae otra keystore,
      # se caza en segundos y no tras 40 minutos de build.
      - name: Reconstruir la debug.keystore del founder
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto DEBUG_KEYSTORE_BASE64 del repo."
            echo "::error::Sin él sólo se podría firmar con una llave inventada, y ese APK NO"
            echo "::error::actualiza ninguna terminal en la calle. Cómo subirlo:"
            echo "::error::  .claude/rules/release-and-git.md → «La llave de firma y el CI»"
            exit 1
          fi
          mkdir -p ~/.android
          # tr -d: tolera que el secreto se haya pegado partido en varias líneas.
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > ~/.android/debug.keystore
          test -s ~/.android/debug.keystore \
            || { echo "::error::DEBUG_KEYSTORE_BASE64 no decodificó a nada — ¿se pegó completo?"; exit 1; }

          huella=$(keytool -list -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey 2>/dev/null \
            | grep -iE 'SHA-?256:' | head -1 | sed -E 's/.*SHA-?256:[[:space:]]*//' \
            | tr -d ':[:space:]' | tr 'A-Z' 'a-z')
          echo "huella del keystore reconstruido: ${huella:-<no se pudo leer>}"
          if [ "$huella" != "$HUELLA_ESPERADA" ]; then
            echo "::error::El keystore del secreto NO es el del founder."
            echo "::error::  esperada: $HUELLA_ESPERADA"
            echo "::error::  obtenida: ${huella:-<no se pudo leer: alias o contraseña distintos>}"
            echo "::error::Regenera el secreto desde la Mac: base64 -i ~/.android/debug.keystore | pbcopy"
            exit 1
          fi
          echo "✓ keystore correcto (alias androiddebugkey, huella $HUELLA_ESPERADA)"

      # 🔴 Repo PRIVADO: GitHub da la MITAD de recursos que a uno público — 2
      # núcleos / 8 GB, no los 4/16 que tiene avoqado-android (público, OTRA
      # máquina). La primera corrida real reventó por memoria compilando
      # PRODUCTION + NEXGOPROD seguidos (OutOfMemoryError en
      # compileNexgoProdReleaseKotlin) — se acota desde GRADLE_USER_HOME (gana
      # sobre el del proyecto) para no tocar lo que usa el founder en su Mac.
      - name: Acotar memoria al tamaño del runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx3g
          org.gradle.workers.max=2
          org.gradle.daemon=false
          org.gradle.parallel=false
          EOF

      - name: SDK de Android + build-tools con apksigner
        uses: android-actions/setup-android@v3
        with:
          # 35.0.0: la última versión estable con el binario real de apksigner
          # (la propia ceremonia lo documenta — algunas carpetas más nuevas
          # vienen vacías).
          packages: 'platforms;android-36 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # Puerta antes de firmar nada: si un test truena, no se produce NINGÚN
      # artefacto — ni el de PAX ni el de Nexgo.
      #
      # sandbox, NO production: verificado en vivo (2026-09-03) que
      # testProductionDebugUnitTest FALLA por compilar el mismo src/test contra
      # el .aar VIEJO (lib_services-1.2.0.0-PROD) que production declara —
      # BlumonSaleReferenceTest usa campos que sólo existen en el SDK 1.6.1.2 que
      # trae sandbox. CLAUDE.md de este repo documenta testSandboxDebugUnitTest
      # como el comando canónico (220 tests) — no fue elección, fue corregir un
      # error propio de este CI, nunca del código de pagos.
      - name: Tests unitarios (puerta)
        run: ./gradlew testSandboxDebugUnitTest
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      # Dos pasos separados, NO una sola invocación con los dos targets: el
      # OOM real (compileNexgoProdReleaseKotlin) fue el compilador de Kotlin
      # acumulando la presión de DOS compilaciones release+R8 en el mismo
      # proceso, en un runner de sólo 8 GB. Cada `./gradlew` aparte arranca
      # con el heap libre.
      - name: Compilar PAX (production), sin firmar
        run: ./gradlew assembleProductionRelease

      - name: Compilar Nexgo (nexgoProd), sin firmar
        run: ./gradlew assembleNexgoProdRelease

      - name: Firmar los dos APK con apksigner (v2 requerido, targetSdk 34+)
        id: firma
        run: |
          # No confiar en una sola variable: distintas imágenes de runner exportan
          # ANDROID_SDK_ROOT o ANDROID_HOME, y a veces sólo una de las dos.
          RAIZ_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$RAIZ_SDK/build-tools" -maxdepth 2 -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          [ -x "$APKSIGNER" ] || { echo "::error::No encontré apksigner bajo $RAIZ_SDK/build-tools"; exit 1; }
          echo "apksigner: $APKSIGNER"
          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          firmar() {
            local flavor_dir="$1" nombre="$2"
            local unsigned="app/build/outputs/apk/${flavor_dir}/release/app-${flavor_dir}-release-unsigned.apk"
            local out="app-${nombre}-${SHA}-signed.apk"
            test -s "$unsigned" || { echo "::error::No se generó $unsigned"; exit 1; }
            "$APKSIGNER" sign --ks ~/.android/debug.keystore \
              --ks-pass pass:android --key-pass pass:android \
              --out "$out" "$unsigned"
            # --print-certs junto a --verbose: una sola llamada da las DOS cosas
            # que hay que comprobar — el esquema de firma y CON QUÉ llave se firmó.
            "$APKSIGNER" verify --verbose --print-certs "$out" | tee /tmp/verify-$nombre.txt
            grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/verify-$nombre.txt \
              || { echo "::error::$nombre — NO quedó firmado con v2 scheme."; exit 1; }

            # 🔴 La comprobación que faltaba (7-sep-2026): que la firma sea VÁLIDA
            # no dice nada de con QUÉ llave se firmó. Un APK con otra huella se
            # instala perfecto en un aparato limpio y es IMPOSIBLE de instalar
            # encima de una terminal que ya tiene Avoqado. Sin esto, la diferencia
            # no aparece hasta que alguien intenta actualizar una terminal real.
            local huella
            huella=$(grep -m1 -i 'certificate SHA-256 digest' /tmp/verify-$nombre.txt \
              | sed 's/.*digest: *//' | tr -d '[:space:]' | tr 'A-Z' 'a-z')
            echo "$nombre — huella del certificado: ${huella:-<no se pudo leer>}"
            if [ "$huella" != "$HUELLA_ESPERADA" ]; then
              echo "::error::$nombre — firmado con la llave EQUIVOCADA."
              echo "::error::  esperada: $HUELLA_ESPERADA (la ~/.android/debug.keystore del founder)"
              echo "::error::  obtenida: ${huella:-<no se pudo leer>}"
              echo "::error::Un APK con otra huella NO puede actualizar una terminal que ya tenga"
              echo "::error::Avoqado (INSTALL_FAILED_UPDATE_INCOMPATIBLE). Revisa DEBUG_KEYSTORE_BASE64."
              exit 1
            fi
            echo "✓ $nombre firmado, v2 verificado y con la llave correcta: $out"
          }

          firmar production pax
          firmar nexgoProd nexgo

      # ── GitHub Releases ─────────────────────────────────────────────────────
      - name: Publicar los dos APK en GitHub Releases
        id: gh_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ steps.firma.outputs.sha }}"
          TAG="build-$SHA"
          NOTAS=$(git log -1 --pretty=%s)
          URL=$(gh release create "$TAG" \
            app-pax-${SHA}-signed.apk \
            app-nexgo-${SHA}-signed.apk \
            --title "Signed build $SHA" \
            --notes "$(printf '%s\n\n🔴 PAX (app-pax-%s-signed.apk): firmado con apksigner, listo para mandar a Blumon — TODAVÍA necesita que PAX lo re-firme antes de instalarse en una terminal real.\n\n🟢 Nexgo (app-nexgo-%s-signed.apk): firmado y listo para entregar al equipo de AngelPay, sin pasos pendientes de nuestro lado.' "$NOTAS" "$SHA" "$SHA")" \
            --target "${{ github.sha }}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Release: $URL"

      - name: Resumen
        if: success()
        run: |
          {
            echo "### ✅ Build ${{ steps.firma.outputs.sha }} — PAX y Nexgo firmados"
            echo ""
            echo "📦 ${{ steps.gh_release.outputs.url }}"
            echo ""
            echo "🔴 PAX: enviar a Blumon para el re-firmado — sigue sin ser el binario final de terminal."
            echo "🟢 Nexgo: listo, entregar directo al equipo de AngelPay."
          } >> "$GITHUB_STEP_SUMMARY"
