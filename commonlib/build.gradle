apply plugin: 'com.android.library'

android {
    compileSdkVersion 34  // Updated to match app module
    namespace = "com.pax.commonlib"
    defaultConfig {
        minSdkVersion 27  // Updated to match app module (Blumon SDK requirement)
        targetSdkVersion 34  // Updated to match app module
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17  // Updated to match app module
        targetCompatibility JavaVersion.VERSION_17
    }

}
repositories{
    flatDir {
        dirs 'libs'
    }
}
dependencies {
    api fileTree(dir: 'libs', include: ['*.jar'])
}
